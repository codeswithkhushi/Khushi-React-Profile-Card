<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khushi — React Profile Card | ApnoAI Intern</title>

  <!-- React 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (lets us write JSX directly in HTML without any build tools) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      transition: background-color 0.4s ease;
    }
    .glass {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }
    .glass-dark {
      background: rgba(17, 24, 39, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .glass-pill-dark {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    .animate-pulse-glow {
      animation: pulseGlow 4s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // =========================================================================
    // REACT CONCEPTS:
    // 1. COMPONENTS: Reusable UI blocks (ProfileCard function returning JSX)
    // 2. PROPS: Inputs passed into component (name, role, skills, avatar, etc.)
    // 3. STATE: Dynamic internal memory managed with useState (theme, connect, likes)
    // =========================================================================

    function ProfileCard({
      name,
      role,
      status,
      bio,
      skills,
      avatar,
      initialLikes = 45,
      github,
      linkedin
    }) {
      // -----------------------------------------------------------------------
      // STATE (Dynamic Data)
      // -----------------------------------------------------------------------
      // 1. Theme State (Dark / Light mode)
      const [isDark, setIsDark] = useState(false);

      // 2. Connect Button State
      const [isConnected, setIsConnected] = useState(false);

      // 3. Interactive Like Counter (Bonus Feature +10 XP)
      const [likes, setLikes] = useState(initialLikes);
      const [hasLiked, setHasLiked] = useState(false);

      const toggleTheme = () => setIsDark(prev => !prev);
      const toggleConnect = () => setIsConnected(prev => !prev);

      const handleLike = () => {
        if (hasLiked) {
          setLikes(prev => prev - 1);
          setHasLiked(false);
        } else {
          setLikes(prev => prev + 1);
          setHasLiked(true);
        }
      };

      return (
        <div
          className={`min-h-screen w-full flex items-center justify-center p-4 sm:p-6 transition-all duration-500 relative overflow-hidden ${
            isDark
              ? 'bg-gradient-to-br from-gray-950 via-slate-900 to-zinc-900 text-white'
              : 'bg-gradient-to-br from-purple-400 via-pink-300 to-amber-200 text-gray-900'
          }`}
        >
          {/* Ambient Background Glow Effect */}
          <div className="absolute top-1/4 -left-20 w-80 h-80 rounded-full bg-purple-500/20 blur-3xl pointer-events-none animate-pulse-glow"></div>
          <div className="absolute bottom-1/4 -right-20 w-80 h-80 rounded-full bg-pink-500/20 blur-3xl pointer-events-none animate-pulse-glow" style={{ animationDelay: '2s' }}></div>

          {/* Theme Toggle Button - Floating Top Right */}
          <button
            onClick={toggleTheme}
            className={`fixed top-5 right-5 p-3 rounded-full shadow-lg transition-all duration-300 transform hover:scale-110 active:scale-95 z-20 ${
              isDark ? 'glass-dark hover:bg-white/10' : 'glass hover:bg-white/40'
            }`}
            title={isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
            aria-label="Toggle Theme"
          >
            <span className="text-xl select-none">{isDark ? '☀️' : '🌙'}</span>
          </button>

          {/* Main Glassmorphism Profile Card */}
          <div
            className={`w-full max-w-md rounded-3xl p-6 sm:p-8 transition-all duration-300 z-10 ${
              isDark ? 'glass-dark' : 'glass'
            }`}
          >
            {/* Top Bar: Intern Status Badge + Like Counter Button */}
            <div className="flex items-center justify-between mb-6">
              {/* Status Badge */}
              <div
                className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold ${
                  isDark ? 'glass-pill-dark text-emerald-400' : 'glass-pill text-emerald-900'
                }`}
              >
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span>{status || 'Intern at ApnoAI'}</span>
              </div>

              {/* Like Button with Counter (Bonus Challenge) */}
              <button
                onClick={handleLike}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all duration-300 transform active:scale-95 ${
                  hasLiked
                    ? 'bg-red-500 text-white shadow-md shadow-red-500/30'
                    : isDark
                    ? 'glass-pill-dark text-gray-300 hover:text-white hover:bg-white/10'
                    : 'glass-pill text-gray-800 hover:text-red-600 hover:bg-white/40'
                }`}
                title="Like Profile"
              >
                <span className={`text-sm transition-transform duration-300 ${hasLiked ? 'scale-125' : ''}`}>
                  {hasLiked ? '❤️' : '🤍'}
                </span>
                <span>{likes}</span>
              </button>
            </div>

            {/* Profile Avatar */}
            <div className="flex justify-center mb-5">
              <div className="relative group">
                <img
                  src={avatar}
                  alt={name}
                  onError={(e) => {
                    // Fallback professional avatar
                    e.currentTarget.onerror = null;
                    e.currentTarget.src = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=400&fit=crop&crop=faces";
                  }}
                  className="w-28 h-28 sm:w-32 sm:h-32 rounded-full object-cover border-4 border-white/60 shadow-xl transition-transform duration-300 group-hover:scale-105"
                />
                <span className="absolute bottom-1 right-2 w-5 h-5 bg-green-500 border-2 border-white rounded-full"></span>
              </div>
            </div>

            {/* Intern Name & Role */}
            <div className="text-center mb-4">
              <h1 className={`text-2xl sm:text-3xl font-extrabold tracking-tight mb-1 ${isDark ? 'text-white' : 'text-gray-900'}`}>
                {name}
              </h1>
              <p className={`text-sm sm:text-base font-semibold ${isDark ? 'text-purple-300' : 'text-purple-700'}`}>
                {role}
              </p>
            </div>

            {/* Intern Bio */}
            <p className={`text-center text-sm leading-relaxed mb-6 px-2 ${isDark ? 'text-gray-300' : 'text-gray-700'}`}>
              {bio}
            </p>

            {/* Languages & Technologies Used for this Intern */}
            <div className="mb-6">
              <p className={`text-xs font-bold uppercase tracking-wider text-center mb-2.5 ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>
                Tech Stack & Languages
              </p>
              <div className="flex flex-wrap gap-2 justify-center">
                {skills && skills.map((skill, index) => (
                  <span
                    key={index}
                    className={`px-3 py-1 rounded-full text-xs font-medium transition-all duration-200 hover:-translate-y-0.5 ${
                      isDark
                        ? 'bg-white/10 text-gray-200 border border-white/15 hover:bg-white/15'
                        : 'bg-white/60 text-gray-800 border border-white/50 hover:bg-white/80 shadow-sm'
                    }`}
                  >
                    {skill}
                  </span>
                ))}
              </div>
            </div>

            {/* Connect Button (Interactive State) */}
            <button
              onClick={toggleConnect}
              className={`w-full py-3 rounded-2xl font-semibold text-sm mb-6 transition-all duration-300 shadow-md transform active:scale-[0.98] ${
                isConnected
                  ? 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-emerald-500/25'
                  : isDark
                  ? 'bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white shadow-purple-500/25'
                  : 'bg-gray-900 hover:bg-gray-800 text-white shadow-gray-900/25'
              }`}
            >
              {isConnected ? '✓ Connected with Khushi' : 'Connect'}
            </button>

            {/* Only GitHub and LinkedIn Logos / Buttons */}
            <div className="grid grid-cols-2 gap-3 pt-2">
              {/* GitHub Button */}
              {github && (
                <a
                  href={github}
                  target="_blank"
                  rel="noopener noreferrer"
                  className={`flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl font-medium text-xs sm:text-sm transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-sm ${
                    isDark
                      ? 'bg-white/10 hover:bg-white/20 text-white border border-white/15'
                      : 'bg-white/70 hover:bg-white text-gray-900 border border-white/60'
                  }`}
                  aria-label="GitHub Profile"
                  title="Open GitHub Profile"
                >
                  {/* GitHub Logo */}
                  <svg className="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                  </svg>
                  <span>GitHub</span>
                </a>
              )}

              {/* LinkedIn Button */}
              {linkedin && (
                <a
                  href={linkedin}
                  target="_blank"
                  rel="noopener noreferrer"
                  className={`flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl font-medium text-xs sm:text-sm transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-sm ${
                    isDark
                      ? 'bg-blue-600/25 hover:bg-blue-600/40 text-blue-300 border border-blue-400/30'
                      : 'bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200'
                  }`}
                  aria-label="LinkedIn Profile"
                  title="Open LinkedIn Profile"
                >
                  {/* LinkedIn Logo */}
                  <svg className="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                  </svg>
                  <span>LinkedIn</span>
                </a>
              )}
            </div>

            {/* Footer Attribution */}
            <div className="mt-6 pt-5 border-t border-white/20 text-center">
              <p className={`text-xs ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>
                Built with <span className="text-red-500">♥</span> using React 18 & Tailwind CSS · ApnoAI Task 2
              </p>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // CUSTOMIZED PROFILE CARD INSTANCE (Props for Khushi)
    // =========================================================================
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ProfileCard
        name="Khushi"
        role="Web Development Intern at ApnoAI"
        status="Web Dev Intern @ ApnoAI"
        bio="Web Development Intern at ApnoAI passionate about building modern, responsive, and component-driven web applications using React, JavaScript, and Tailwind CSS."
        skills={["React 18", "JavaScript (ES6+)", "Tailwind CSS", "HTML5", "CSS3", "Git & GitHub"]}
        avatar="https://github.com/codeswithkhushi.png"
        initialLikes={52}
        github="https://github.com/codeswithkhushi"
        linkedin="https://www.linkedin.com/in/khushi-67102939a"
      />
    );
  </script>
</body>
</html>
